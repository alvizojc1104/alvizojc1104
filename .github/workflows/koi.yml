name: Koi

on:
  schedule:
    # Runs just after midnight UTC every day to render yesterday's activity
    - cron: "20 0 * * *"
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
  push:
    paths:
      - .github/workflows/koi.yml
      - scripts/update_profile_assets.py
      - scripts/enforce_surface_feeding.py

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: git-profile-koi
        uses: yalongwastaken/git-koi@v1
        with:
          body: white # Options: white, black, asagi, tea, gold, platinum
          output-dir: koi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Enforce surface feeding animation
        run: |
          python scripts/enforce_surface_feeding.py

      - name: Generate bonsai and profile stats
        run: |
          python -m pip install Pillow
          python scripts/update_profile_assets.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif koi/koi-coral.gif bonsai/bonsai.gif assets/*.svg
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
